name: Fork CI

# Replaces the upstream ci.yml, which stays unmodified for clean upstream syncs
# and is disabled in this fork's Actions settings.
#
# Branch pushes run an incremental check of what changed since the merge base
# with main. Check runs attach to the commit, so a pull request from a branch of
# this repository reuses them instead of running CI a second time. Pushes to
# main (merges) run the full suite and then publish the image.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push cancels the older run. On main this keeps only
# the latest merge, so a burst of merges builds the image once.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      frontend_related: ${{ steps.detect.outputs.frontend_related }}
      frontend_shards: ${{ steps.detect.outputs.frontend_shards }}

    steps:
      - name: Debounce merges to main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # A merge within 30s cancels this run through the concurrency group.
        run: sleep 30

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect changed areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          full=false
          base=""
          if [ "$GIT_REF" = "refs/heads/main" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            full=true
          else
            base=$(git merge-base origin/main HEAD) || full=true
          fi
          backend=false
          frontend=false
          frontend_full=false
          if [ "$full" = "true" ]; then
            backend=true
            frontend=true
            frontend_full=true
          else
            files=$(git diff --name-only "$base" HEAD)
            echo "Changed since $base:"
            echo "$files"
            if echo "$files" | grep -qxF '.github/workflows/fork-ci.yml'; then
              backend=true
              frontend=true
              frontend_full=true
            fi
            if echo "$files" | grep -qvE '^(web/|docs/|electron/|\.github/)|\.md$'; then
              backend=true
            fi
            if echo "$files" | grep -qE '^web/'; then
              frontend=true
            fi
            # Dependency or test-harness changes can affect every test.
            if echo "$files" | grep -qE '^web/(package\.json|bun\.lock|vitest\.config\.ts|tsconfig[^/]*\.json|src/test-setup\.ts)$'; then
              frontend_full=true
            fi
          fi

          if [ "$frontend_full" = "true" ]; then
            echo 'frontend_shards=["1/3","2/3","3/3"]' >> "$GITHUB_OUTPUT"
            echo "frontend_related=" >> "$GITHUB_OUTPUT"
          else
            # Vitest runs only the tests that import a changed source file.
            related=$(git diff --name-only --diff-filter=d "$base" HEAD -- web/ | sed 's#^web/##' | tr '\n' ' ')
            echo 'frontend_shards=["1/1"]' >> "$GITHUB_OUTPUT"
            echo "frontend_related=$related" >> "$GITHUB_OUTPUT"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend frontend_full=$frontend_full"

  backend:
    name: Backend vet, build, and test
    needs: changes
    # A failed detection runs the checks instead of skipping them, so a
    # required check never passes by being skipped after an error.
    if: >-
      always() && needs.changes.result != 'cancelled' &&
      (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # Build and test results are restored from the latest main run, so a
      # branch only recompiles and retests the packages its changes affect.
      - name: Restore Go cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'relaykit/go.sum', 'tokenkit/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'relaykit/go.sum', 'tokenkit/go.sum') }}-
            go-${{ runner.os }}-

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

      # Only main writes the cache, so branches always start from main's
      # build and test results and never evict each other.
      - name: Save Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'relaykit/go.sum', 'tokenkit/go.sum') }}-${{ github.sha }}

  frontend:
    name: Frontend test (${{ matrix.shard }})
    needs: changes
    if: >-
      always() && needs.changes.result != 'cancelled' &&
      (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.frontend_shards || '["1/3","2/3","3/3"]') }}
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          RELATED: ${{ needs.changes.outputs.frontend_related }}
        run: |
          if [ -n "$RELATED" ]; then
            # shellcheck disable=SC2086 # RELATED is a space-separated path list
            bunx vitest related --run --passWithNoTests $RELATED
          else
            bun run test --shard="$SHARD"
          fi

  # Required check. A job skipped because its area did not change counts as
  # passing for branch protection.
  frontend-typecheck:
    name: Frontend typecheck
    needs: changes
    if: >-
      always() && needs.changes.result != 'cancelled' &&
      (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
  # Images are built only from main, after every check of the same commit
  # passed. The concurrency group above keeps only the newest merge.
  publish:
    name: Build and publish linux-amd64 image
    needs: [changes, backend, frontend, frontend-typecheck]
    if: github.ref == 'refs/heads/main' && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.frontend-typecheck.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/mmsfus/new-api

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write deployment summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Custom image"
            echo '```text'
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
            echo "${IMAGE_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"